<body>
<canvas id="c"></canvas>
<script>
const STYLES = {
  white: { bg: '#fffaf2', ink: '#2b2622', acc: '#ff7fb0', deco: '★' },
  black: { bg: '#151517', ink: '#f4f1ea', acc: '#e9f06a', deco: '★' },
  pink: { bg: '#ffd3e3', ink: '#9c2a52', acc: '#ff5c8a', deco: '♥ ♥' },
  mint: { bg: '#c9f1df', ink: '#1f6b4f', acc: '#f2b630', deco: '★' },
  film: { bg: '#111111', ink: '#f4f1ea', acc: '#f2b630', deco: '●' },
  army: { bg: '#5f6b3a', ink: '#f4f1ea', acc: '#e9f06a', deco: '▲' },
};
const FONT = '"Apple SD Gothic Neo", "Noto Sans KR", sans-serif';

function loadImg(url) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = url;
  });
}

function camo(ctx, x, y, w, h) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = '#5f6b3a';
  ctx.fillRect(x, y, w, h);
  const cols = ['#4a5530', '#7d8a45', '#3b3a2c'];
  const n = Math.ceil((w * h) / 900);
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = cols[i % 3];
    ctx.beginPath();
    const r = 6 + Math.random() * 16;
    ctx.ellipse(x + Math.random() * w, y + Math.random() * h, r * 1.4, r, Math.random() * 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

async function frameImage(o) {
  const shot = await loadImg(o.shot);
  const w = shot.naturalWidth, h = shot.naturalHeight;
  const u = Math.max(10, Math.min(w, h) * 0.035);
  const side = Math.round(u), top = Math.round(u * 2.4), bottom = Math.round(u * 3.6);
  const cw = w + side * 2, ch = h + top + bottom;
  const c = document.getElementById('c');
  c.width = cw;
  c.height = ch;
  const ctx = c.getContext('2d');
  const st = STYLES[o.style] || STYLES.white;
  if (o.style === 'army') camo(ctx, 0, 0, cw, ch);
  else {
    ctx.fillStyle = st.bg;
    ctx.fillRect(0, 0, cw, ch);
  }
  if (o.style === 'film') {
    ctx.fillStyle = '#e9e4d6';
    const hole = u * 0.45, gap = u * 0.9;
    for (let x = gap / 2; x < cw; x += gap) {
      ctx.fillRect(x, u * 0.3, hole, hole * 0.8);
      ctx.fillRect(x, ch - u * 0.3 - hole * 0.8, hole, hole * 0.8);
    }
  }
  ctx.drawImage(shot, side, top, w, h);
  ctx.strokeStyle = st.ink;
  ctx.globalAlpha = 0.55;
  ctx.lineWidth = Math.max(1, u * 0.08);
  ctx.strokeRect(side, top, w, h);
  ctx.globalAlpha = 1;
  if (o.custom) {
    const f = await loadImg(o.custom);
    ctx.drawImage(f, 0, 0, cw, ch);
  } else {
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.font = `800 ${Math.round(u * 0.95)}px ${FONT}`;
    const title = '전역까지';
    const tw = ctx.measureText(title).width;
    ctx.fillStyle = st.ink;
    ctx.fillText(title, cw / 2, top / 2);
    ctx.fillStyle = st.acc;
    ctx.font = `700 ${Math.round(u * 0.85)}px ${FONT}`;
    ctx.fillText(st.deco, cw / 2 - tw / 2 - u * 1.2, top / 2);
    ctx.fillText(st.deco, cw / 2 + tw / 2 + u * 1.2, top / 2);
    const by = top + h + bottom / 2;
    ctx.textAlign = 'left';
    ctx.font = `900 ${Math.round(u * 1.5)}px ${FONT}`;
    if (o.style === 'army') {
      const tw2 = ctx.measureText(o.dday).width;
      ctx.fillStyle = '#c9ced3';
      ctx.strokeStyle = '#2b2622';
      ctx.lineWidth = Math.max(1, u * 0.1);
      const bx = side + u * 0.6, bw = tw2 + u * 1.2, bh = u * 2;
      ctx.beginPath();
      ctx.roundRect(bx, by - bh / 2, bw, bh, u * 0.5);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#2b2622';
      ctx.fillText(o.dday, bx + u * 0.6, by);
    } else {
      ctx.fillStyle = st.ink;
      ctx.fillText(o.dday, side + u * 0.6, by);
    }
    ctx.textAlign = 'right';
    ctx.font = `700 ${Math.round(u * 0.7)}px ui-monospace, Menlo, monospace`;
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = st.ink;
    ctx.fillText(o.date, cw - side - u * 0.6, by);
    ctx.globalAlpha = 1;
  }
  return c.toDataURL('image/png');
}
const SPEC = {
  single: { w: 1920, h: 1500, cells: [[60, 120, 1800, 1125]], foot: [1245, 1500] },
  two: { w: 1200, h: 1840, cells: [[60, 170, 1080, 675], [60, 885, 1080, 675]], foot: [1560, 1840] },
  strip: { w: 1200, h: 3600, cells: [[60, 150, 1080, 675], [60, 865, 1080, 675], [60, 1580, 1080, 675], [60, 2295, 1080, 675]], foot: [2970, 3600] },
  grid: { w: 1800, h: 1400, cells: [[60, 140, 820, 512], [920, 140, 820, 512], [60, 692, 820, 512], [920, 692, 820, 512]], foot: [1204, 1400] },
};

function drawCover(ctx, img, x, y, w, h, r) {
  // 스크린샷은 잘라내지 않고 칸 안에 전부 들어가게 넣음. 비율이 다르면 남는 부분은 같은 사진을 흐리게 깔아 채움
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const cover = Math.max(w / iw, h / ih), fit = Math.min(w / iw, h / ih);
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.clip();
  if (fit / cover > 0.97) {
    const sw = w / cover, sh = h / cover;
    ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, x, y, w, h);
  } else {
    const bw = iw * cover * 1.15, bh = ih * cover * 1.15;
    ctx.filter = 'blur(26px) brightness(0.9)';
    ctx.drawImage(img, x + (w - bw) / 2, y + (h - bh) / 2, bw, bh);
    ctx.filter = 'none';
    const dw = iw * fit, dh = ih * fit;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }
  ctx.restore();
}

async function frameFixed(o) {
  const sp = SPEC[o.layout] || SPEC.single;
  const imgs = [];
  for (const s of o.shots) imgs.push(await loadImg(s));
  const c = document.getElementById('c');
  c.width = sp.w;
  c.height = sp.h;
  const ctx = c.getContext('2d');
  const st = STYLES[o.style] || STYLES.white;
  const u = sp.w * (o.layout === 'strip' ? 0.05 : 0.03);
  if (!o.custom) {
    if (o.style === 'army') camo(ctx, 0, 0, sp.w, sp.h);
    else {
      ctx.fillStyle = st.bg;
      ctx.fillRect(0, 0, sp.w, sp.h);
    }
    if (o.style === 'film') {
      ctx.fillStyle = '#e9e4d6';
      const hole = 20, step = 44;
      for (let y = step / 2; y < sp.h; y += step) {
        ctx.fillRect(14, y, 16, hole);
        ctx.fillRect(sp.w - 30, y, 16, hole);
      }
    }
  }
  sp.cells.forEach((cell, i) => drawCover(ctx, imgs[i % imgs.length], cell[0], cell[1], cell[2], cell[3], 14));
  if (o.custom) {
    const fr = await loadImg(o.custom);
    ctx.drawImage(fr, 0, 0, sp.w, sp.h);
  } else {
    const ty = sp.cells[0][1] / 2;
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'center';
    ctx.fillStyle = st.ink;
    ctx.font = `800 ${Math.round(u * 1.05)}px ${FONT}`;
    const tw = ctx.measureText('전역까지').width;
    ctx.fillText('전역까지', sp.w / 2, ty);
    ctx.fillStyle = st.acc;
    ctx.font = `700 ${Math.round(u * 0.9)}px ${FONT}`;
    ctx.fillText(st.deco, sp.w / 2 - tw / 2 - u * 1.3, ty);
    ctx.fillText(st.deco, sp.w / 2 + tw / 2 + u * 1.3, ty);
  }
  const fy = (sp.foot[0] + sp.foot[1]) / 2;
  const fu = Math.min(u, (sp.foot[1] - sp.foot[0]) / 4);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillStyle = o.custom ? (o.ink || '#2b2622') : st.ink;
  ctx.font = `900 ${Math.round(fu * 1.7)}px ${FONT}`;
  ctx.fillText(o.dday, sp.w / 2, fy - fu * 0.5);
  ctx.globalAlpha = 0.7;
  ctx.font = `700 ${Math.round(fu * 0.75)}px ui-monospace, Menlo, monospace`;
  ctx.fillText(o.date, sp.w / 2, fy + fu * 1.1);
  ctx.globalAlpha = 1;
  return c.toDataURL('image/png');
}
const frameFour = frameFixed;

/* ---------- theme frames ---------- */
const THEMES = {
  doodle: { w: 1200, h: 1800, cells: [[70, 560, 520, 390], [70, 990, 520, 390], [610, 150, 520, 390], [610, 580, 520, 390]], r: 6 },
  greenstrip: { w: 1200, h: 3600, cells: [[110, 300, 980, 612], [110, 990, 980, 612], [110, 1680, 980, 612], [110, 2370, 980, 612]], r: 10 },
  rsnight: { w: 1200, h: 3600, cells: [[50, 220, 1100, 690], [50, 950, 1100, 690], [50, 1680, 1100, 690], [50, 2410, 1100, 690]], r: 28 },
  rsdiary: { w: 1200, h: 3600, cells: [[60, 260, 1080, 675], [60, 975, 1080, 675], [60, 1690, 1080, 675], [60, 2405, 1080, 675]], r: 4 },
  rsfilm: { w: 1200, h: 3600, cells: [[95, 200, 1010, 690], [95, 930, 1010, 690], [95, 1660, 1010, 690], [95, 2390, 1010, 690]], r: 6 },
  rssweater: { w: 2000, h: 1560, cells: [[40, 170, 950, 594], [1010, 170, 950, 594], [40, 800, 950, 594], [1010, 800, 950, 594]], r: 24 },
  gystrip: { w: 1200, h: 3600, cells: [[50, 230, 1100, 690], [50, 960, 1100, 690], [50, 1690, 1100, 690], [50, 2420, 1100, 690]], r: 20 },
  gygrid: { w: 2000, h: 1560, cells: [[40, 180, 950, 594], [1010, 180, 950, 594], [40, 800, 950, 594], [1010, 800, 950, 594]], r: 20 },
  gybig: { w: 1200, h: 1800, cells: [[60, 190, 1080, 675], [60, 900, 340, 255], [430, 900, 340, 255], [800, 900, 340, 255]], r: 16 },
  gyscatter: { w: 1800, h: 1800, rot: [[470, 520, -6], [1330, 500, 5], [490, 1270, 4], [1310, 1290, -5]], cw: 700, ch: 438 },
  rspulse: { w: 2000, h: 2420, cells: [[40, 160, 950, 594], [1010, 160, 950, 594], [40, 774, 950, 594], [1010, 774, 950, 594]], r: 30 },
  rsstage: { w: 1200, h: 3600, cells: [[50, 210, 1100, 620], [50, 870, 1100, 620], [50, 1530, 1100, 620], [50, 2190, 1100, 620]], r: 18 },
  rstrot: { w: 1200, h: 3600, cells: [[60, 200, 1080, 560], [60, 800, 1080, 560], [60, 1400, 1080, 560], [60, 2000, 1080, 560]], r: 18 },
  rescene: { w: 1200, h: 3600, cells: [[50, 270, 1100, 620], [50, 930, 1100, 620], [50, 1590, 1100, 620], [50, 2250, 1100, 620]], r: 90 },
  holo: { w: 1200, h: 3600, cells: [[120, 260, 960, 620], [120, 960, 960, 620], [120, 1660, 960, 620], [120, 2360, 960, 620]], r: 150 },
};
const INK = '#1d1a18';
const PEN = '"JY Pen", "Apple SD Gothic Neo", sans-serif';
let rnd = 1;
function rand() { rnd = (rnd * 16807) % 2147483647; return (rnd - 1) / 2147483646; }

function charImg(slot, outfit, pose) {
  const g = new CharRig(slot, { outfit });
  g.pose(Object.assign({ blink: 1 }, pose || {}));
  g.svg.setAttribute('width', 400);
  g.svg.setAttribute('height', 496);
  const xml = new XMLSerializer().serializeToString(g.svg);
  return loadImg('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml));
}
function drawChar(ctx, img, x, y, h, rot, flip) {
  const w = h * 100 / 124;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) * Math.PI / 180);
  if (flip) ctx.scale(-1, 1);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();
}
function stroke(ctx, w) {
  ctx.lineWidth = w || 5;
  ctx.strokeStyle = INK;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();
}
function sparkle(ctx, x, y, s, fill) {
  ctx.beginPath();
  ctx.moveTo(x, y - s);
  ctx.quadraticCurveTo(x + s * 0.12, y - s * 0.12, x + s * 0.7, y);
  ctx.quadraticCurveTo(x + s * 0.12, y + s * 0.12, x, y + s);
  ctx.quadraticCurveTo(x - s * 0.12, y + s * 0.12, x - s * 0.7, y);
  ctx.quadraticCurveTo(x - s * 0.12, y - s * 0.12, x, y - s);
  ctx.fillStyle = fill || '#ffe14a';
  ctx.fill();
  if (fill !== '#ffffff') stroke(ctx, 4);
}
function heart(ctx, x, y, s, fill, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) * Math.PI / 180);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.35);
  ctx.bezierCurveTo(-s * 1.1, -s * 0.3, -s * 0.45, -s * 1.0, 0, -s * 0.35);
  ctx.bezierCurveTo(s * 0.45, -s * 1.0, s * 1.1, -s * 0.3, 0, s * 0.35);
  ctx.fillStyle = fill;
  ctx.fill();
  stroke(ctx, 4);
  ctx.restore();
}
function clover(ctx, x, y, s, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) * Math.PI / 180);
  ctx.fillStyle = '#7ad957';
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 3;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5, s * 0.48, 0, Math.PI * 2);
    ctx.fill();
    stroke(ctx, 4);
  }
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, s * 0.2);
  ctx.quadraticCurveTo(s * 0.1, s * 0.8, s * 0.4, s * 1.1);
  stroke(ctx, 4);
  ctx.restore();
}
function bubble(ctx, x, y, w, h, lines, size, tail) {
  ctx.beginPath();
  ctx.ellipse(x, y, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  stroke(ctx, 4);
  if (tail) {
    ctx.beginPath();
    ctx.moveTo(x + tail[0], y + tail[1]);
    ctx.lineTo(x + tail[2], y + tail[3]);
    ctx.lineTo(x + tail[4], y + tail[5]);
    ctx.fill();
    stroke(ctx, 4);
    ctx.beginPath();
    ctx.moveTo(x + tail[0], y + tail[1]);
    ctx.lineTo(x + tail[4], y + tail[5]);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 6;
    ctx.stroke();
  }
  penText(ctx, lines, x, y, size, INK);
}
function penText(ctx, lines, x, y, size, fill, outline, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) * Math.PI / 180);
  ctx.font = `${size}px ${PEN}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const lh = size * 0.95;
  lines.forEach((t, i) => {
    const ly = (i - (lines.length - 1) / 2) * lh;
    if (outline) {
      ctx.lineWidth = outline[1];
      ctx.strokeStyle = outline[0];
      ctx.lineJoin = 'round';
      ctx.strokeText(t, 0, ly);
    }
    ctx.fillStyle = fill;
    ctx.fillText(t, 0, ly);
  });
  ctx.restore();
}
function scallop(ctx, x, y, w, h, fill) {
  const r = h / 2;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fillStyle = fill;
  ctx.fill();
  const n = Math.round(w / 34);
  for (let i = 0; i <= n; i++) {
    const cx = x + r + (w - 2 * r) * i / n;
    ctx.beginPath();
    ctx.arc(cx, y + 4, 14, Math.PI, 0);
    ctx.arc(cx, y + h - 4, 14, 0, Math.PI);
    ctx.fill();
  }
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  stroke(ctx, 5);
}
function burst(ctx, x, y, rw, rh, fill, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) * Math.PI / 180);
  ctx.beginPath();
  const n = 18;
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n;
    const k = i % 2 ? 0.78 : 1;
    ctx.lineTo(Math.cos(a) * rw * k, Math.sin(a) * rh * k);
  }
  ctx.closePath();
  ctx.fillStyle = fill;
  ctx.fill();
  stroke(ctx, 4);
  ctx.restore();
}
function cellsDraw(ctx, th, imgs) {
  th.cells.forEach((c, i) => drawCover(ctx, imgs[i % imgs.length], c[0], c[1], c[2], c[3], th.r));
}

async function themeDoodle(ctx, th, imgs, o) {
  ctx.fillStyle = '#c6f39b';
  ctx.fillRect(0, 0, th.w, th.h);
  cellsDraw(ctx, th, imgs);
  th.cells.forEach((c) => { ctx.beginPath(); ctx.roundRect(c[0], c[1], c[2], c[3], th.r); stroke(ctx, 5); });
  const days = String(o.dday);
  penText(ctx, ['전역까지'], 230, 120, 108, '#ff4fa3', ['#ffffff', 12], -4);
  heart(ctx, 160, 290, 95, '#ffb3c8', -8);
  heart(ctx, 330, 285, 95, '#ffb3c8', 6);
  heart(ctx, 495, 292, 90, '#ffb3c8', -4);
  penText(ctx, [days], 330, 280, 140, '#ffe14a', [INK, 10], -2);
  penText(ctx, ['남았다'], 220, 420, 96, '#ff4fa3', ['#ffffff', 12], 3);
  const b = await charImg('b', 'military', { arm: -20 });
  drawChar(ctx, b, 470, 470, 210, 0);
  bubble(ctx, 560, 300, 160, 100, ['꿀빨아?!'], 46, [-40, 30, -80, 75, 0, 48]);
  penText(ctx, ['전역네컷 × 버티기'], 870, 1060, 64, '#7a3cff', null, -2);
  scallop(ctx, 640, 1015, 460, 92, '#ffe14a');
  penText(ctx, ['전역네컷 × 버티기'], 870, 1062, 60, '#ff4fa3');
  bubble(ctx, 600, 1440, 220, 170, ['그렇게!', '버티면!', '전역 될 일!'], 40, [70, -50, 130, -90, 100, -30]);
  const a = await charImg('a', 'animal', { arm: 30, darm: -40 });
  drawChar(ctx, a, 890, 1440, 520, -4);
  burst(ctx, 980, 1660, 170, 110, '#ffe14a', -10);
  penText(ctx, ['전역', '축하해요'], 980, 1660, 54, INK, null, -10);
  ctx.globalAlpha = 0.75;
  penText(ctx, [o.date], 330, 1440, 48, INK);
  ctx.globalAlpha = 1;
  rnd = 7;
  const deco = [[560, 70, 's'], [1140, 60, 's'], [40, 520, 's'], [1160, 520, 'h'], [600, 520, 's'], [1160, 980, 'h'], [40, 1180, 'h'], [600, 980, 'c'], [40, 1500, 's'], [600, 1700, 'h'], [1150, 1260, 'c'], [60, 1720, 'c'], [700, 1120, 'h'], [920, 60, 'h']];
  for (const [x, y, k] of deco) {
    if (k === 's') sparkle(ctx, x, y, 34);
    else if (k === 'h') heart(ctx, x, y, 30, rand() > 0.5 ? '#ff4fa3' : '#ff9a6b', rand() * 40 - 20);
    else clover(ctx, x, y, 34, rand() * 40 - 20);
  }
}

async function themeGreenStrip(ctx, th, imgs, o) {
  ctx.fillStyle = '#fbf6e8';
  ctx.fillRect(0, 0, th.w, th.h);
  ctx.beginPath();
  ctx.roundRect(30, 30, th.w - 60, th.h - 60, 50);
  ctx.fillStyle = '#5fbf4a';
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = '#4aa83a';
  for (let i = 0; i < 9; i++) {
    const y = 200 + i * 420;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(300, y - 160, 700, y + 220, 1200, y - 60);
    ctx.lineTo(1200, y + 40);
    ctx.bezierCurveTo(700, y + 300, 300, y - 60, 0, y + 110);
    ctx.fill();
  }
  rnd = 3;
  for (let i = 0; i < 70; i++) {
    const x = 50 + rand() * 1100, y = 50 + rand() * 3500;
    ctx.beginPath();
    ctx.arc(x, y, 6 + rand() * 9, 0, Math.PI * 2);
    ctx.fillStyle = rand() > 0.75 ? '#ff9a2e' : '#ffffff';
    ctx.fill();
  }
  ctx.restore();
  th.cells.forEach((c) => {
    ctx.beginPath();
    ctx.roundRect(c[0] - 14, c[1] - 14, c[2] + 28, c[3] + 28, 22);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
  });
  cellsDraw(ctx, th, imgs);

function stickerDraw(ctx, img, x, y, w, h) {
  const t = document.createElement('canvas');
  t.width = Math.ceil(w) + 24;
  t.height = Math.ceil(h) + 24;
  const tc = t.getContext('2d');
  for (let a = 0; a < 16; a++) tc.drawImage(img, 12 + Math.cos(a * Math.PI / 8) * 7, 12 + Math.sin(a * Math.PI / 8) * 7, w, h);
  tc.globalCompositeOperation = 'source-in';
  tc.fillStyle = '#ffffff';
  tc.fillRect(0, 0, t.width, t.height);
  tc.globalCompositeOperation = 'source-over';
  tc.drawImage(img, 12, 12, w, h);
  ctx.drawImage(t, x - 12, y - 12);
}

function cutInCell(ctx, th, i, im, side, k) {
  const c = th.cells[i];
  const h = c[3] * k;
  const w = h * im.naturalWidth / im.naturalHeight;
  const x = side === 'r' ? c[0] + c[2] - w + 12 : c[0] - 12;
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(c[0], c[1], c[2], c[3], th.r);
  ctx.clip();
  stickerDraw(ctx, im, x, c[1] + c[3] - h + 12, w, h);
  ctx.restore();
}
function circleBadge(ctx, im, cx, cy, r, ring) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = ring;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  const s = Math.max(2 * r / im.naturalWidth, 2 * r / im.naturalHeight);
  ctx.drawImage(im, cx - im.naturalWidth * s / 2, cy - im.naturalHeight * s / 2 + r * 0.15, im.naturalWidth * s, im.naturalHeight * s);
  ctx.restore();
}
function tape(ctx, x, y, w, rot, col) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot * Math.PI / 180);
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-w / 2, -24);
  for (let i = 0; i <= 6; i++) ctx.lineTo(-w / 2 + (i % 2 ? 6 : 0), -24 + i * 8);
  ctx.lineTo(w / 2, 24);
  for (let i = 0; i <= 6; i++) ctx.lineTo(w / 2 - (i % 2 ? 6 : 0), 24 - i * 8);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function leopard(ctx, w, h, base, spot, inner, seed, sc) {
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, w, h);
  rnd = seed;
  const step = 78 * sc;
  for (let gy = -step; gy < h + step; gy += step) {
    for (let gx = -step; gx < w + step; gx += step) {
      const x = gx + (rand() - 0.5) * step * 0.7 + ((gy / step) % 2 ? step / 2 : 0);
      const y = gy + (rand() - 0.5) * step * 0.7;
      const r = (16 + rand() * 12) * sc;
      if (rand() < 0.18) {
        ctx.fillStyle = spot;
        ctx.beginPath();
        ctx.ellipse(x, y, r * 0.45, r * 0.32, rand() * 3, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }

function goldText(ctx, text, x, y, size, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rot || 0) * Math.PI / 180);
  ctx.font = `900 ${size}px "Apple SD Gothic Neo", "Noto Serif KR", serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = size * 0.22;
  ctx.strokeStyle = '#5a0f12';
  ctx.strokeText(text, 0, 0);
  ctx.lineWidth = size * 0.08;
  ctx.strokeStyle = '#fff3c4';
  ctx.strokeText(text, 0, 0);
  const g = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
  g.addColorStop(0, '#fff6c8');
  g.addColorStop(0.45, '#f6c64a');
  g.addColorStop(0.55, '#d99a1e');
  g.addColorStop(1, '#ffe7a0');
  ctx.fillStyle = g;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
function trotBg(ctx, W, H) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#7a1016');
  g.addColorStop(1, '#3d0609');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 70) {
    const s = ctx.createLinearGradient(x, 0, x + 70, 0);
    s.addColorStop(0, 'rgba(0,0,0,0.28)');
    s.addColorStop(0.5, 'rgba(255,120,120,0.10)');
    s.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = s;
    ctx.fillRect(x, 0, 70, H);
  }
  const sp = ctx.createRadialGradient(W / 2, -H * 0.1, 0, W / 2, -H * 0.1, H * 0.8);
  sp.addColorStop(0, 'rgba(255,220,140,0.35)');
  sp.addColorStop(1, 'rgba(255,220,140,0)');
  ctx.fillStyle = sp;
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#e8b64a';
  ctx.lineWidth = 6;
  ctx.strokeRect(18, 18, W - 36, H - 36);
  ctx.lineWidth = 2;
  ctx.strokeRect(32, 32, W - 64, H - 64);
  rnd = 17;
  for (let i = 0; i < W * H / 60000; i++) sparkle(ctx, 40 + rand() * (W - 80), 40 + rand() * (H - 80), 8 + rand() * 14, '#ffffff');
}
function goldFrameRect(ctx, x, y, w, h, r) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.45)';
  ctx.shadowBlur = 20;
  ctx.beginPath();
  ctx.roundRect(x - 14, y - 14, w + 28, h + 28, r + 14);
  const g = ctx.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, '#fff0b0');
  g.addColorStop(0.3, '#d9a233');
  g.addColorStop(0.6, '#ffe39a');
  g.addColorStop(1, '#b77e1c');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.restore();
}
function mic(ctx, x, y, s, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot * Math.PI / 180);
  ctx.fillStyle = '#2b2622';
  ctx.beginPath();
  ctx.roundRect(-s * 0.18, s * 0.3, s * 0.36, s * 1.2, s * 0.1);
  ctx.fill();
  const g = ctx.createRadialGradient(-s * 0.15, -s * 0.15, 0, 0, 0, s * 0.5);
  g.addColorStop(0, '#ffffff');
  g.addColorStop(1, '#9aa0a6');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, s * 0.45, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2b2622';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}
async function themeTrot(ctx, th, imgs, o, n) {

  if (cm && cm[2] === 'trot') await themeTrot(ctx, th, imgs, o, Number(cm[1]));

  return c.toDataURL('image/png');
}
