name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.exists.outputs.skip == 'false'
        run: npm ci

      - name: Build macOS app (Apple Silicon)
        if: steps.exists.outputs.skip == 'false'
        run: |
          npx @electron/packager . Jeonyeok --platform=darwin --arch=arm64 --out=build --overwrite \
            --app-bundle-id=com.dd.jeonyeok --app-version=${{ steps.v.outputs.version }} \
            --ignore='^/\.github' --ignore='^/build' --ignore='^/install\.sh'
          cd build/Jeonyeok-darwin-arm64
          zip -qry ../../Jeonyeok-mac.zip Jeonyeok.app

      - name: Build live update package (app code only)
        if: steps.exists.outputs.skip == 'false'
        run: |
          mkdir -p live/node_modules/@mediapipe
          cp *.js *.html *.css package.json changelog.json live/
          cp -r fonts frames live/
          cp -r node_modules/@mediapipe/selfie_segmentation live/node_modules/@mediapipe/
          cd live && zip -qry ../jeonyeok-live.zip .

      - uses: actions/upload-artifact@v4
        if: steps.exists.outputs.skip == 'false'
        with:
          name: dist
          path: |
            Jeonyeok-mac.zip
            jeonyeok-live.zip

  mac-test:
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: macos-14
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Unpack and sign
        run: |
          ditto -xk Jeonyeok-mac.zip app
          xattr -cr app/Jeonyeok.app
          codesign -f --deep -s - app/Jeonyeok.app

      - name: Run app self test
        run: |
          UD="$RUNNER_TEMP/ud"
          mkdir -p "$UD"
          echo '{"discharge":"2027-06-01","name":"테스트","capture":"normal","lastVersion":"0.0.0"}' > "$UD/config.json"
          JY_SELFTEST=1 JY_USERDATA="$UD" JY_OUT="$PWD/out" ./app/Jeonyeok.app/Contents/MacOS/Jeonyeok || echo "exit $?"
          cat out/result.json
          node -e "const r=require('./out/result.json'); if(r.errors.length||r.errorLog||!r.checks.overlay){console.error('self test failed');process.exit(1)}"

      - name: Run live update test
        run: |
          UD="$RUNNER_TEMP/ud2"
          mkdir -p "$UD/live"
          echo '{"discharge":"2027-06-01"}' > "$UD/config.json"
          ditto -xk jeonyeok-live.zip "$UD/live"
          node -e "const f='$UD/live/package.json';const p=require(f);p.version='99.0.0';require('fs').writeFileSync(f,JSON.stringify(p))"
          JY_SELFTEST=version JY_USERDATA="$UD" JY_OUT="$PWD/out-live" ./app/Jeonyeok.app/Contents/MacOS/Jeonyeok || true
          cat out-live/result.json
          node -e "const r=require('./out-live/result.json'); if(r.version!=='99.0.0'){console.error('live update not applied');process.exit(1)}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-test
          path: |
            out
            out-live

  release:
    needs: [build, mac-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.build.outputs.version }}
          NOTES=$(node -e "const c=require('./changelog.json').find(e=>e.version==='$V'); console.log(c ? c.items.map(i=>'- '+i).join('\\n') : '')")
          [ -z "$NOTES" ] && NOTES=$(git log -1 --pretty=%B)
          gh release create "v$V" Jeonyeok-mac.zip jeonyeok-live.zip --title "v$V" --notes "$NOTES"
