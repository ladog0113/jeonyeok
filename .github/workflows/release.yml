name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if this version is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.exists.outputs.skip == 'false'
        run: npm ci

      - name: Build macOS app (Apple Silicon)
        if: steps.exists.outputs.skip == 'false'
        run: |
          npx @electron/packager . Jeonyeok --platform=darwin --arch=arm64 --out=build --overwrite \
            --app-bundle-id=com.dd.jeonyeok --app-version=${{ steps.v.outputs.version }} \
            --ignore='^/\.github' --ignore='^/build'
          cd build/Jeonyeok-darwin-arm64
          zip -qry ../../Jeonyeok-mac.zip Jeonyeok.app

      - name: Build live update package (app code only)
        if: steps.exists.outputs.skip == 'false'
        run: |
          mkdir -p live/node_modules/@mediapipe
          cp *.js *.html *.css package.json live/
          cp -r fonts frames live/
          cp -r node_modules/@mediapipe/selfie_segmentation live/node_modules/@mediapipe/
          cd live && zip -qry ../jeonyeok-live.zip .

      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.v.outputs.version }}
          NOTES=$(node -e "const c=require('./changelog.json').find(e=>e.version==='$V'); console.log(c ? c.items.map(i=>'- '+i).join('\\n') : '')")
          [ -z "$NOTES" ] && NOTES=$(git log -1 --pretty=%B)
          gh release create "v$V" Jeonyeok-mac.zip jeonyeok-live.zip --title "v$V" --notes "$NOTES"
