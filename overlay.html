<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="pets.css">
</head>
<body>
<svg id="cracks" width="100%" height="100%"></svg>
<div id="stage"></div>
<div id="frame" hidden></div>
<script>
const faceCache = {};
function normFace(f) {
  if (!f) return null;
  return typeof f === 'string' ? { file: f } : f;
}
window.petEnv = {
  setIgnore: (v) => window.api.setIgnore(v),
  petExit: (info) => window.api.petExit(info),
  cardList: () => window.api.cardList(),
  recordCard: (id, rare) => window.api.recordCard(id, rare),
  careGet: () => window.api.careGet(),
  careSet: (s, v) => window.api.careSet(s, v),
  weatherNow: () => window.api.weatherNow(),
  frameFor: async (cfg) => (cfg.frameFile ? window.api.frameData() : null),
  faceFor: async (slot, cfg) => {
    const f = normFace((cfg.faces || {})[slot]);
    if (!f) return null;
    if (!faceCache[f.file]) faceCache[f.file] = await window.api.faceData(slot);
    if (!faceCache[f.file]) return null;
    const params = f.s != null ? { x: f.x, y: f.y, s: f.s, r: f.r || 0, pts: f.pts, cut: !!f.cut } : null;
    return { key: JSON.stringify(f), url: faceCache[f.file], params };
  },
};
</script>
<script src="character.js"></script>
<script src="fx.js"></script>
<script src="pets.js"></script>
<script src="life.js"></script>
<script>
window.api.on('poke', (slot) => petWorld.poke(slot));
window.api.on('smash', (slot) => petWorld.smash(slot));
for (const k of ['spin', 'dance', 'neon', 'whistle', 'shimmy', 'heart', 'power', 'cheer', 'sign', 'slime', 'sleep', 'brush', 'flip', 'pop', 'rest', 'stretch', 'wave', 'horn', 'chime', 'bread', 'morph', 'receipt', 'talk', 'hi5', 'rps', 'tag', 'nap', 'life', 'acryl', 'feed', 'petpet', 'steal', 'trash', 'weather', 'clone', 'toe', 'star', 'grip', 'scribble']) window.api.on(k, (slot) => petWorld[k](slot));
window.api.on('spawn', (info) => petWorld.spawn(info));
window.api.on('wake', () => petWorld.wake());
setInterval(() => { try { window.api.beat(petWorld.health()); } catch {} }, 3000);
window.api.on('screens', (n) => petWorld.setScreens(n));
window.api.on('config-updated', (c) => petWorld.setConfig(c));
window.api.on('cards-updated', () => petWorld.reloadCards());
window.api.on('milestone', (d) => petWorld.milestone(d));
window.api.on('banner', (o) => petWorld.banner(o));
window.addEventListener('error', (e) => window.api.logError(`overlay: ${e.message} @ ${e.filename}:${e.lineno}`));
window.addEventListener('unhandledrejection', (e) => window.api.logError(`overlay: ${(e.reason && (e.reason.stack || e.reason.message)) || e.reason}`));
window.api.init().then((info) => petWorld.start(info.cfg, info.pets, info.screens));
</script>
</body>
</html>
