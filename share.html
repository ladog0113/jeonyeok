<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title></title>
<style>
:root { --label: #1d1d1f; --secondary: rgba(60, 60, 67, .6); --btn: rgba(255, 255, 255, .9); --sep: rgba(0, 0, 0, .14); --blue: #007aff; --bg: #ececec; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --label: #f5f5f7; --secondary: rgba(235, 235, 245, .6); --btn: rgba(255, 255, 255, .12); --sep: rgba(255, 255, 255, .12); --blue: #0a84ff; --bg: #1e1e1e; } }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--label); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-app-region: drag; }
html.vibrant body { background: transparent; }
.pic { flex: 1; min-height: 0; padding: 36px 16px 10px; display: flex; align-items: center; justify-content: center; }
.pic img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); -webkit-app-region: no-drag; cursor: default; }
.name { text-align: center; color: var(--secondary); font-size: 11px; padding: 0 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 10px 14px 14px; -webkit-app-region: no-drag; }
.acts button { font: inherit; font-size: 12px; color: var(--label); padding: 6px 0; border: 0; border-radius: 7px; background: var(--btn); box-shadow: 0 0 0 .5px var(--sep), 0 1px 1px rgba(0,0,0,.06); cursor: default; }
.acts button.primary { background: var(--blue); color: #fff; box-shadow: none; }
.acts button:active { filter: brightness(.92); }
</style>
</head>
<body>
<div class="pic"><img id="img" alt=""></div>
<div class="name" id="name"></div>
<div class="acts">
  <button id="copy">복사</button>
  <button id="finder">Finder</button>
  <button id="share" class="primary">공유</button>
</div>
<script>
if (/vibrancy=1/.test(location.search)) document.documentElement.classList.add('vibrant');
(async () => {
  const d = await window.api.shareData();
  if (!d) return;
  document.getElementById('img').src = d.url;
  document.getElementById('name').textContent = d.name;
  const b = (id, cmd) => document.getElementById(id) && (document.getElementById(id).onclick = async (e) => {
    await window.api.shareDo(cmd);
    if (cmd === 'copy') { e.target.textContent = '복사됨'; setTimeout(() => (e.target.textContent = '복사'), 1500); }
  });
  if (window.api.platform !== 'darwin') {
    document.getElementById('share').remove();
    document.querySelector('.acts').style.gridTemplateColumns = '1fr 1fr';
    document.getElementById('finder').textContent = '폴더에서 보기';
    document.getElementById('finder').classList.add('primary');
  }
  b('copy', 'copy');
  b('finder', 'finder');
  b('share', 'share');
  document.getElementById('img').ondblclick = () => window.api.shareDo('open');
  let hover = false;
  document.body.onmouseenter = () => (hover = true);
  document.body.onmouseleave = () => (hover = false);
  let left = 25;
  setInterval(() => { if (!hover && --left <= 0) window.close(); }, 1000);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
})();
</script>
</body>
</html>
