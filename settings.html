<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<style>
:root {
  --label: #1d1d1f; --secondary: rgba(60, 60, 67, .6); --tertiary: rgba(60, 60, 67, .3);
  --sep: rgba(60, 60, 67, .14); --group: #fff; --content: #f2f2f7; --side: #e9e9ee;
  --seg: rgba(118, 118, 128, .14); --seg-on: #fff; --blue: #007aff; --hover: rgba(0, 0, 0, .05);
  --sel: rgba(0, 0, 0, .08); --btn: #fff; --switch-off: rgba(120, 120, 128, .24);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --label: #f5f5f7; --secondary: rgba(235, 235, 245, .6); --tertiary: rgba(235, 235, 245, .3);
    --sep: rgba(84, 84, 88, .5); --group: #2c2c2e; --content: #1c1c1e; --side: #252527;
    --seg: rgba(118, 118, 128, .24); --seg-on: #636366; --blue: #0a84ff; --hover: rgba(255, 255, 255, .06);
    --sel: rgba(255, 255, 255, .1); --btn: #48484a; --switch-off: rgba(120, 120, 128, .4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; color: var(--label); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; user-select: none; -webkit-user-select: none; background: var(--content); }
html.vibrant body { background: transparent; }
nav { width: 200px; flex: none; padding: 46px 10px 12px; background: var(--side); -webkit-app-region: drag; display: flex; flex-direction: column; gap: 2px; }
html.vibrant nav { background: transparent; }
nav button { -webkit-app-region: no-drag; display: flex; align-items: center; gap: 9px; width: 100%; padding: 5px 8px; border: 0; border-radius: 6px; background: none; color: var(--label); font: inherit; text-align: left; cursor: default; }
nav button:hover { background: var(--hover); }
nav button[aria-current="true"] { background: var(--sel); }
nav .ic { width: 20px; height: 20px; border-radius: 5px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 11px; font-weight: 700; flex: none; }
main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--content); }
main header { -webkit-app-region: drag; padding: 14px 24px 8px; min-height: 46px; display: flex; align-items: flex-end; }
main h1 { margin: 0; font-size: 15px; font-weight: 600; }
.scroll { flex: 1; overflow: auto; padding: 4px 24px 28px; }
.sec-h { margin: 18px 10px 6px; color: var(--secondary); font-size: 12px; font-weight: 500; }
.sec-h:first-child { margin-top: 6px; }
.group { background: var(--group); border-radius: 10px; box-shadow: 0 0 0 .5px var(--sep); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 7px 12px; }
.row + .row { border-top: .5px solid var(--sep); }
.row .lb { flex: 1; min-width: 0; }
.row .val { color: var(--secondary); }
.sw { position: relative; width: 32px; height: 19px; flex: none; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.sw span { position: absolute; inset: 0; border-radius: 99px; background: var(--switch-off); transition: background .2s; }
.sw span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .2s; }
.sw input:checked + span { background: #34c759; }
.sw input:checked + span::after { transform: translateX(13px); }
.sw input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 7px; background: var(--seg); }
.seg button { font: inherit; font-size: 12px; color: var(--label); padding: 2px 11px; border: 0; border-radius: 5px; background: transparent; cursor: default; }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.06); }
.btn { font: inherit; font-size: 12px; color: var(--label); padding: 3px 11px; border-radius: 6px; border: 0; background: var(--btn); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 1px 1px rgba(0,0,0,.08); cursor: default; white-space: nowrap; }
.btn.primary { background: var(--blue); color: #fff; box-shadow: none; }
.btn:active { filter: brightness(.93); }
select { font: inherit; font-size: 12px; color: var(--label); padding: 3px 6px; border-radius: 6px; border: 0; background: var(--btn); box-shadow: 0 0 0 .5px rgba(0,0,0,.18), 0 1px 1px rgba(0,0,0,.08); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 6px; padding: 10px; }
.grid .btn { padding: 6px 8px; }
.thumb { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; background: var(--seg); flex: none; }
.radio { display: flex; align-items: center; gap: 10px; cursor: default; }
.radio i { width: 16px; height: 16px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--tertiary); }
.radio[aria-checked="true"] i { box-shadow: inset 0 0 0 5px var(--blue); }
.swatches { display: flex; gap: 8px; }
.swatches button { width: 22px; height: 22px; border-radius: 50%; border: 0; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); cursor: default; }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--blue); outline-offset: 2px; }
.styles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.styles .radio { padding: 8px 12px; border-top: .5px solid var(--sep); margin-top: -.5px; }
.cards-top { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
.cards-top .stat { flex: 1; }
.cards-top .stat b { font-size: 20px; font-weight: 600; }
.cards-top .stat span { color: var(--secondary); margin-left: 6px; }
.bar { height: 5px; border-radius: 99px; background: var(--seg); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
.pc { position: relative; aspect-ratio: 550 / 850; border-radius: 8px; overflow: hidden; background: var(--group); box-shadow: 0 0 0 .5px var(--sep), 0 1px 3px rgba(0,0,0,.08); cursor: default; }
.pc img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pc.locked { background: repeating-linear-gradient(45deg, #ffb3d6 0 8px, #ff9cc8 8px 16px); display: flex; align-items: center; justify-content: center; }
.pc.locked span { color: #fff; font-weight: 800; font-size: 13px; opacity: .9; }
.pc .rk { position: absolute; left: 5px; top: 5px; padding: 1px 6px; border-radius: 99px; font-size: 10px; font-weight: 800; background: rgba(255,255,255,.9); color: #c81d6a; }
.pc .rk.SSR { background: #ffd23f; color: #6b3b00; }
.pc .rk.SR { background: linear-gradient(90deg, #ffd1ea, #c9f1ff); color: #6a2bb0; }
.pc .cnt { position: absolute; right: 5px; bottom: 5px; padding: 1px 6px; border-radius: 99px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,.55); color: #fff; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 10; }
.lightbox[hidden] { display: none; }
.lightbox img { max-height: 84vh; max-width: 70vw; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.note { color: var(--secondary); font-size: 12px; padding: 6px 10px 0; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
  <header><h1 id="title"></h1></header>
  <div class="scroll" id="body"></div>
</main>
<div class="lightbox" id="lb" hidden><img id="lb-img" alt=""></div>
<script src="settings.js"></script>
</body>
</html>
